<header class="main-header">

  <a
    class="logo"
    routerLink="/"
    (click)="closeMenu()">
    PerfumeApp
  </a>

  <button
    type="button"
    class="menu-button"
    (click)="toggleMenu()"
    aria-label="Open navigation menu">
    ☰
  </button>

  <nav [class.open]="menuOpen()">

    <a
      routerLink="/"
      (click)="closeMenu()">
      Home
    </a>

    <a
      routerLink="/perfumes"
      (click)="closeMenu()">
      Perfumes
    </a>

    

    <a
      href=""
      (click)="
        $event.preventDefault();
        goToAddPerfume()
      ">
      Add Perfume
    </a>
    <a
      routerLink="/about"
      (click)="closeMenu()">
      About
    </a>

    @if (isLoggedIn()) {

      <a
        href=""
        (click)="
          $event.preventDefault();
          logout()
        ">
        Logout
      </a>

    } @else {

      <a
        routerLink="/login"
        (click)="closeMenu()">
        Login
      </a>

    }

  </nav>

</header>

<main>
  <router-outlet />
</main>

<header class="main-header">

  <a
    class="logo"
    routerLink="/"
    (click)="closeMenu()">
    PerfumeApp
  </a>

  <!-- burger button only shows on small screens -->
  <button
    type="button"
    class="menu-button"
    (click)="toggleMenu()"
    aria-label="Open navigation menu">

    ☰

  </button>

  <nav [class.open]="menuOpen()">

    <a
      routerLink="/"
      (click)="closeMenu()">
      Home
    </a>

    <a
      routerLink="/perfumes"
      (click)="closeMenu()">
      Perfumes
    </a>

    <a
      routerLink="/perfumes/new"
      (click)="closeMenu()">
      Add Perfume
    </a>

  </nav>

</header>

<main>
  <router-outlet />
</main>
